    <title>Miss das Spektrum der Natriumlampe</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div>
    <section class="sun-spectrum-layout" aria-label="Vergleich von Leuchtstoffröhren">
        <div class="sun-spectrum-grid">
            <article class="sun-spectrum-card">
                <h2>CCD-Spektrometer</h2>
                <img
                        src="../images/spectra/natrium_CCD.png"
                        alt="Natriumspektrum aufgenommen mit einem CCD-Spektrometer"
                />
            </article>

            <article class="sun-spectrum-card" style="background: black">
                <h2>Handspektrometer</h2>
                <img
                        src="../images/spectra/natrium_Hand.jpg"
                        alt="Natriumspektrum aufgenommen mit einem Handspektrometer"
                />
            </article>
        </div>
        <p class="sun-spectrum-note">
            Das Spektrum der Natriumdampflampe besteht aus einer Doppellinie.
            Diese befindet sich im sichtbaren gelben Bereich, bei 589 nm und 589,6 nm.
            Das Licht ist also nahezu monochromatisch.
        </p>
    </section>
