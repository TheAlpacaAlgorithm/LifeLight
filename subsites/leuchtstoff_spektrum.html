<div>
    <section class="sun-spectrum-layout" aria-label="Vergleich von Leuchtstoffröhren">
        <div class="sun-spectrum-grid">
            <article class="sun-spectrum-card">
                <h2>CCD-Spektrometer</h2>
                <img
                        src="../images/spectra/leuchtstoff_CCD.jpg"
                        alt="Leuchtstoffröhrenspektrum aufgenommen mit einem CCD-Spektrometer"
                />
            </article>

            <article class="sun-spectrum-card" style="background: black">
                <h2>Handspektrometer</h2>

                        src="../images/spectra/leuchtstoff_Hand.jpg"
                        alt="Leuchtstoffröhrenspektrum aufgenommen mit einem Handspektrometer"
                />
            </article>
        </div>
        <p class="sun-spectrum-note">
            Das weiße, helle Licht dieser ausgedehnten Lampen wird oft in großen Räumen (z.B. Schulen, Büros) genutzt, da es eine gleichmäßige Ausleuchtung und eine förderliche Arbeitsatmosphäre ermöglicht.
